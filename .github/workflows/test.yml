name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pyflakes
      - run: python -m pyflakes pet.py app.py menu.py look.py sounds.py sprites.py xp.py cast.py game.py party.py tools/grid_to_pack.py tools/make_cast.py
      - run: python pet.py test
